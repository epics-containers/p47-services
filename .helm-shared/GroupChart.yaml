# A Helm Chart for a group of IOC instances that differ only by environment
apiVersion: v2
name: ec-group-service
version: 1.0.0

type: application

# ioc-group renders the ioc-instance library once per entry in .Values.iocs,
# so it pulls ioc-instance in for us - do not depend on ioc-instance here too.
#
# NOTE: ioc-group is not published to oci://ghcr.io/epics-containers/charts
# yet, so this points at a local checkout of ec-helm-charts alongside this
# repo. Swap to the commented out oci lines (and drop the entry in
# .ci_skip_checks) once ioc-group has been released.
dependencies:
  - name: ioc-group
    version: 1.0.0
    repository: "file://../../../ec-helm-charts/Charts/ioc-group"
    # version: 1.0.0
    # repository: "oci://ghcr.io/epics-containers/charts"
    import-values:
      - child: ioc-instance
        parent: ioc-instance
