## yaml-language-server: $schema=../../.helm-shared/values.schema.json

ioc-instance:
  image: ghcr.io/diamondlightsource/fastcs-example-debug:2025.10.1
  args:
    - stdio-socket --ptty "fastcs-example run /epics/ioc/config/controller.yaml"

  extraContainers:
    - name: temp-controller-simulator
      image: ghcr.io/diamondlightsource/fastcs-example:2025.9.1
      command:
        - tickit
        - all
        - /epics/ioc/config/temp_controller.yaml

  # example of adding an initContainer
  initContainers:
    - name: test-init
      image: alpine/git
      command:
        - git
        - version

  # don't use the ioc-instance livenesProbe, preStop which dont exist in fastcs image.
  livenessExecutable: ""
  preStopExecutable: ""

# podbench Hotfix mode: a claim carrying the project, mounted beside the
# application's own and never over it. The claim's name comes from the
# release, and `podbench hotfix values` writes the matching volume into
# the application's own values when this is next turned on.
#
# Phase 7 (2026-08-24) retired the live hotfix this branch carried: the
# supervisor loop, the podbench-app/podbench-home volumes, the
# volumeMounts and podSecurityContext.fsGroup are all removed from
# ioc-instance above (not just this flag) - see
# `podbench hotfix retire`'s "wiring" step, which is what enumerated
# them. Flipping enabled: false alone was tried once already
# (94b74d2) and left the pod still hotfix-wired; this commit does not
# repeat that.
podbench-hotfix-claim:
  enabled: false
  size: 2Gi
