blueapi:
  debug:
    enabled: true
  hostNetwork: false
  # resources:
  #   limits:
  #     cpu: 2000m
  #     memory: 4000Mi
  #   requests:
  #     cpu: 500m
  #     memory: 400Mi
  nodeSelector:
    beamline: p47

  tolerations:
    - key: beamline
      operator: Equal
      value: p47
      effect: NoSchedule
    - key: nodetype
      operator: Equal
      value: training-rig
      effect: NoSchedule
  ingress:
    enabled: false
    hosts:
      - host: p47-blueapi.diamond.ac.uk
        paths:
          - path: /
            pathType: Prefix
  extraEnvVars:
    - name: BEAMLINE
      value: p47
    - name: INSTRUMENT
      value: p47
    - name: EPICS_PVA_NAME_SERVERS
      value: p47-epics-gateways:9075
    - name: EPICS_CA_NAME_SERVERS
      value: p47-epics-gateways:9064
    - name: EPICS_PVA_AUTO_ADDR_LIST
      value: "NO"
    - name: EPICS_CA_AUTO_ADDR_LIST
      value: "NO"
    
    - name: TILED_WRITER_SECRET
      valueFrom:
        secretKeyRef:
          name: blueapi-secret
          key: tiled-writer-secret
    
  worker:
    env:
      metadata:
        instrument: p47
      sources:
      - kind: deviceManager
        module: dodal.beamlines.training_rig
      - kind: planFunctions
        module: htss_rig_bluesky.plans
      - kind: planFunctions
        module: dodal.plans
      events:
        broadcast_status_events: false
    stomp:
      auth:
        username: guest
        password: guest
      url: tcp://p47-rabbitmq-daq.diamond.ac.uk:61613
      enabled: true
    logging:
      level: "INFO"
      graylog:
        enabled: true
    oidc:
      well_known_url: "https://identity.diamond.ac.uk/realms/dls/.well-known/openid-configuration"
      client_id: "blueapiCli"
      client_audience: "account"
      logout_redirect_endpoint: "oauth2/sign_out"
    numtracker:
      url: https://numtracker-staging.diamond.ac.uk/graphql
    
    
    tiled:
      enabled: true
      url: "https://tiled.diamond.ac.uk/api/v1/"
      authentication:
        client_id: "p47TiledWriter"
        client_secret: ${TILED_WRITER_SECRET}
    
    scratch:
      root: /workspaces
      repositories:
        # - name: ophyd-async
        #   remote_url: https://github.com/bluesky/ophyd-async.git
        - name: dodal
          remote_url: https://github.com/DiamondLightSource/dodal.git
        - name: htss-rig-bluesky
          remote_url: https://github.com/DiamondLightSource/htss-rig-bluesky.git
  initContainer:
    enabled: true
    persistentVolume:
      enabled: true


oauth2:
  proxyVarsAsSecrets: false
  extraEnv:
    - name: OAUTH2_PROXY_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: blueapi-secret
          key: client-secret
    - name: OAUTH2_PROXY_COOKIE_SECRET
      valueFrom:
        secretKeyRef:
          name: blueapi-secret
          key: cookie-secret
  config:
    configFile: |-
      skip_provider_button = true
      skip_jwt_bearer_tokens = true
      cookie_refresh="1m"
      cookie_expire="30m"
      email_domains = [ "*" ]
      skip_auth_routes=[
      "GET=^/config/oidc",
      "GET=^/healthz"
      ]
      whitelist_domains=["identity.diamond.ac.uk"]
  ingress:
    enabled: true
    hosts:
      - p47-blueapi.diamond.ac.uk
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    path: /
    pathType: Prefix
  alphaConfig:
    enabled: true
    configData:
      upstreamConfig:
        proxyRawPath: true
        upstreams:
          - id: blueapi
            path: /
            uri: http://p47-blueapi
      providers:
        - provider: oidc
          id: identity.diamond.ac.uk
          clientID: p47Blueapi
          clientSecret: ${OAUTH2_PROXY_CLIENT_SECRET}
          oidcConfig:
            insecureAllowUnverifiedEmail: true
            insecureSkipNonce: true
            emailClaim: sub
            audienceClaims: ["aud"]
            extraAudiences: ["account"]
            issuerURL: https://identity.diamond.ac.uk/realms/dls
      injectRequestHeaders:
        - name: Authorization
          values:
            - claimSource:
                claim: access_token
                prefix: "Bearer "

  nodeSelector:
    beamline: p47

  tolerations:
    - key: beamline
      operator: Equal
      value: p47
      effect: NoSchedule
    - key: nodetype
      operator: Equal
      value: training-rig
      effect: NoSchedule
