# yaml-language-server: $schema=../../.helm-shared/values.schema.json

# Three simulated area detectors deployed from this single folder by the
# ioc-group chart. The release is called bl47p-ea-simdet, so the IOCs are
# bl47p-ea-simdet-01, -02 and -03.

# settings shared by every IOC in the group
ioc-instance:
  image: ghcr.io/epics-containers/ioc-adsimdetector-developer:2.11ec4

  volumes:
    - name: podbench-app
      persistentVolumeClaim:
        claimName: bl47p-ea-simdet-podbench-project
  volumeMounts:
    - name: podbench-app
      mountPath: /podbench/app
  command: [bash, -c]
  args:
    - |
      while :; do
        [ ! -x /podbench/app/.venv/bin/python ] || export PATH="/podbench/app/.venv/bin:$PATH"
        [ ! -f /podbench/app/.podbench-ptrace.so ] || export LD_PRELOAD=/podbench/app/.podbench-ptrace.so
        setsid bash -c "$1" &
        child=$!
        echo $child > /tmp/podbench-child.pid
        wait $child; rc=$?
        kill -TERM -"$child" 2>/dev/null || true
        [ -e /tmp/podbench-hold ] || exit $rc
      done
    - podbench-supervisor
    - |
      if [[ -f /podbench/app/ioc/start.sh ]]; then
        exec bash /podbench/app/ioc/start.sh
      else
        exec bash -c /epics/ioc/start.sh
      fi
  livenessProbe:
    exec:
      command: [bash, -c, "[ -e /tmp/podbench-hold ] && exit 0; exec /bin/bash /epics/ioc/liveness.sh"]
    failureThreshold: 3
    initialDelaySeconds: 120
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 1
  podSecurityContext:
    fsGroup: 37887

# one entry per IOC. Every entry MUST have a NAME - it is appended to the
# release name to make that IOC's Kubernetes resources unique. The remaining
# keys become extra container environment variables for that IOC alone, and
# config/ioc.yaml reads them back with _global.get_env().
iocs:
  - NAME: "01"
    WIDTH: "1024"
    HEIGHT: "1024"

  - NAME: "02"
    WIDTH: "640"
    HEIGHT: "480"

  - NAME: "03"
    WIDTH: "256"
    HEIGHT: "256"

podbench-hotfix-claim:
  enabled: true
  size: 10Gi
