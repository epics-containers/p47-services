# yaml-language-server: $schema=../ioc.schema.json

ioc_name: "{{ _global.get_env('IOC_NAME') }}"

description: Monitors the lab terminal server over SNMP

entities:
  - type: epics.EpicsEnvSet
    name: EPICS_TZ
    value: GMT0BST

  - type: devIocStats.iocAdminSoft
    IOC: "{{ ioc_name | upper }}"

  - type: terminalServer.Acs32
    name: TSERV
    P: BL47P-NT-TSERV-01
    HOST: ts0001
    NCHANS: 32
